name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - 'docker/**'
  workflow_dispatch:
    inputs:
      image:
        description: 'Container image to deploy (e.g. ghcr.io/asadyare/portfolio-frontend:latest)'
        required: false
        default: ''

env:
  DEPLOY_IMAGE: ${{ github.event.inputs.image || secrets.K8S_DEPLOY_IMAGE || 'ghcr.io/asadyare/portfolio-frontend:latest' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_DATA }}" ]; then
            echo "::error::KUBE_CONFIG_DATA secret is not set. Add your cluster kubeconfig (base64-encoded) in Settings → Secrets → Actions."
            exit 1
          fi
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: |
          kubectl cluster-info || (echo "::error::Cannot reach cluster. Check KUBE_CONFIG_DATA and that the cluster is reachable from GitHub Actions." && exit 1)

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/ -R

      # Always align the running Deployment with DEPLOY_IMAGE (secret / dispatch / default).
      # If this step is skipped when DEPLOY_IMAGE equals the default string, kubectl apply can
      # leave an older image from manifests in place.
      - name: Update deployment image
        run: |
          kubectl set image deployment/portfolio app="${{ env.DEPLOY_IMAGE }}" -n portfolio
