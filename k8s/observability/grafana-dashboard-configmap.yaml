# Grafana dashboard for the portfolio app (ingress-nginx metrics).
# Loaded automatically by kube-prometheus-stack Grafana sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  portfolio-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {"type": "prometheus"},
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "reqps"},
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {
              "expr": "sum(rate(nginx_ingress_controller_requests{ingress=~\"portfolio.*\",namespace=\"portfolio\"}[5m])) by (status)",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "title": "Request rate by status",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus"},
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "reqps"},
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {
              "expr": "sum(rate(nginx_ingress_controller_requests{ingress=~\"portfolio.*\",namespace=\"portfolio\"}[5m]))",
              "legendFormat": "Total",
              "refId": "A"
            }
          ],
          "title": "Total request rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus"},
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "s"},
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "id": 3,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{ingress=~\"portfolio.*\",namespace=\"portfolio\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{ingress=~\"portfolio.*\",namespace=\"portfolio\"}[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "B"
            }
          ],
          "title": "Request latency (p95, p99)",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["portfolio", "ingress"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "",
      "title": "Portfolio Application Overview",
      "uid": "portfolio-overview",
      "version": 1,
      "weekStart": ""
    }
